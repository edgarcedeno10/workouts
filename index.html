<html lang="en">
<head>

<meta name="mobile-web-app-capable" content="yes">

<style>
/* Layout: phone-first training log. Sticky day switcher, one card per exercise with a watch button on the right. */
:root{
  --bg:#eef1f3; --surface:#ffffff; --ink:#16202a; --muted:#5d6b78; --line:#d7dde2;
  --accent:#d2491f; --accent-ink:#ffffff; --done:#2f7d5b; --chip:#e3e8ec;
  --bg2:#f7f9fa; --fig:#16202a; --figfar:#97a3ae; --prop:#8794a0; --propfill:#e6ebef; --wt:#d2491f; --floor:#cfd7dd;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12171c; --surface:#1b2229; --ink:#e7ecf0; --muted:#97a4b0; --line:#2b343d;
  --accent:#f0683c; --accent-ink:#14100e; --done:#5cc095; --chip:#252e37; --bg2:#151b21; --fig:#e7ecf0; --figfar:#6f7d8a; --prop:#6f7d8a; --propfill:#232c35; --wt:#f0683c; --floor:#33404b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171c; --surface:#1b2229; --ink:#e7ecf0; --muted:#97a4b0; --line:#2b343d;
  --accent:#f0683c; --accent-ink:#14100e; --done:#5cc095; --chip:#252e37; --bg2:#151b21; --fig:#e7ecf0; --figfar:#6f7d8a; --prop:#6f7d8a; --propfill:#232c35; --wt:#f0683c; --floor:#33404b; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 10px;border-bottom:1px solid var(--line)}
h1{font-family:var(--display);font-weight:700;font-size:1.6rem;letter-spacing:.02em;text-transform:uppercase;margin:0 0 8px}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.tabs button{font:600 .95rem/1 var(--display);letter-spacing:.04em;text-transform:uppercase;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:10px 0;cursor:pointer;min-width:0}
.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tabs button:focus-visible,.watch:focus-visible,.check:focus-visible,.reset:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.dayhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:18px 0 4px}
h2{font-family:var(--display);font-weight:700;font-size:1.35rem;text-transform:uppercase;letter-spacing:.02em;margin:0;text-wrap:balance}
.progress{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.sub{color:var(--muted);font-size:.9rem;margin:0 0 10px}
.log{grid-column:1 / -1;display:flex;flex-direction:column;gap:6px;padding-top:10px;border-top:1px solid var(--line)}
.setrow{display:flex;align-items:center;gap:8px}
.setn{width:46px;flex:none;font-size:.8rem;font-weight:600;color:var(--muted)}
.setrow .x{flex:none;width:auto}
.bdot{width:14px;height:14px;border-radius:50%;flex:none;border:1px solid var(--line)}
.bandsel{flex:1;min-width:0;font:500 16px/1.2 var(--body);padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.bandsel:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.logfoot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:2px}
.logfoot .last{margin:0}
.log input{flex:1;width:auto;font:500 16px/1.2 var(--body);padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font-variant-numeric:tabular-nums;min-width:0}
.log input::placeholder{color:var(--muted)}
.log span{color:var(--muted);font-size:.85rem}
.logbtn{font:600 .85rem/1 var(--body);background:var(--ink);color:var(--surface);border:0;border-radius:6px;padding:9px 12px;cursor:pointer}
.logbtn:focus-visible,.log input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.last{font-size:.8rem;color:var(--muted);margin:4px 0 0;font-variant-numeric:tabular-nums}
.last b{color:var(--ink);font-weight:600}
.backup{margin-top:22px;padding-top:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.bkbtns{display:flex;gap:8px;flex-wrap:wrap}
label.reset{display:inline-flex;align-items:center}
.bkmsg{margin:0;font-size:.85rem;color:var(--done);min-height:1.2em}
.gnote{color:var(--muted);font-size:.86rem;margin:-2px 0 10px}
.group{font:600 .78rem/1 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}

.list{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.ex{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.ex.is-done .name{text-decoration:line-through;text-decoration-color:var(--muted)}
.ex.is-done{opacity:.72}
.check{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:transparent;cursor:pointer;display:grid;place-items:center;padding:0}
.check svg{width:14px;height:14px;opacity:0}
.ex.is-done .check{background:var(--done);border-color:var(--done)}
.ex.is-done .check svg{opacity:1}
.info{min-width:0}
.name{font-weight:600;font-size:1rem;margin:0}
.dose{display:inline-block;margin-top:4px;font:600 .95rem/1.2 var(--display);letter-spacing:.03em;background:var(--chip);border-radius:5px;padding:3px 7px;font-variant-numeric:tabular-nums}
.note{color:var(--muted);font-size:.86rem;margin:5px 0 0}
.anim{width:104px;aspect-ratio:260/196;max-width:100%;border-radius:8px;background:var(--bg2);border:1px solid var(--line);cursor:zoom-in;display:block;padding:0}
.anim svg{width:100%;height:100%;display:block}
.anim.has-gif{background:#000;overflow:hidden}
.anim img{width:100%;height:100%;object-fit:contain;display:block}
.ex.big .anim.has-gif{aspect-ratio:auto;height:auto}
.ex.big .anim.has-gif img{height:auto;max-height:70vh}
.ex.big .anim{grid-column:1 / -1;grid-row:2;width:100%;cursor:zoom-out}
.vid{display:inline-block;margin-top:6px;font-size:.82rem;color:var(--accent);font-weight:600}
.watch{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;width:64px;height:56px;border-radius:9px;background:var(--accent);color:var(--accent-ink);text-decoration:none;font:600 .72rem/1 var(--body);letter-spacing:.06em;text-transform:uppercase}
.watch svg{width:20px;height:20px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px;flex-wrap:wrap}
.tip{color:var(--muted);font-size:.86rem;margin:0;flex:1 1 220px}
.reset{font:600 .85rem/1 var(--body);background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:10px 14px;cursor:pointer}
@media (prefers-reduced-motion:no-preference){.ex{transition:opacity .15s}}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <h1>Recomp Workouts</h1>
    <div class="tabs" role="tablist" id="tabs"></div>
  </header>
  <main id="day"></main>
</div>

<script>
/* Exercise animation engine: posed stick figure with 2-bone IK, keyframes, props. */
const L={torso:50,neck:7,head:9,ua:29,fa:27,th:43,sh:41,ft:13};
const R=Math.PI/180;
const tdir=t=>[Math.sin(t*R),-Math.cos(t*R)];
const ldir=a=>[Math.sin(a*R),Math.cos(a*R)];
const add=(a,b,k=1)=>[a[0]+b[0]*k,a[1]+b[1]*k];
function ik(A,T,l1,l2,hint){
  const dx=T[0]-A[0],dy=T[1]-A[1],d=Math.hypot(dx,dy)||0.001;
  const dc=Math.min(Math.max(d,Math.abs(l1-l2)+0.01),l1+l2-0.01);
  const ux=dx/d,uy=dy/d,E=[A[0]+ux*dc,A[1]+uy*dc];
  const ang=Math.acos(Math.max(-1,Math.min(1,(l1*l1+dc*dc-l2*l2)/(2*l1*dc))));
  const c=Math.cos(ang),s=Math.sin(ang);
  const j1=[A[0]+l1*(ux*c-uy*s),A[1]+l1*(ux*s+uy*c)];
  const j2=[A[0]+l1*(ux*c+uy*s),A[1]+l1*(-ux*s+uy*c)];
  const m=[(A[0]+E[0])/2,(A[1]+E[1])/2],sc=j=>(j[0]-m[0])*hint[0]+(j[1]-m[1])*hint[1];
  return [sc(j1)>=sc(j2)?j1:j2,E];
}
function solve(p){
  if(p.raw) return {pts:p.raw.pts,raw:p.raw};
  const P={};const tl=p.tl??1;const t=p.t??0,t2=p.t2??t;
  P.hip=p.hip;P.mid=add(P.hip,tdir(t),L.torso/2*tl);P.sh=add(P.mid,tdir(t2),L.torso/2*tl);
  const pr=[Math.cos(t*R),Math.sin(t*R)],pr2=[Math.cos(t2*R),Math.sin(t2*R)];
  const w=p.w??0,sw=p.sw??0;
  P.hipN=add(P.hip,pr,w);P.hipF=add(P.hip,pr,-w);P.shN=add(P.sh,pr2,sw);P.shF=add(P.sh,pr2,-sw);
  P.head=add(add(P.sh,tdir(t2+(p.n??0)),L.neck+L.head),[p.hdx??0,0]);
  const ref=r=>typeof r[0]==="string"?add(r[0]==="s"?P.sh:r[0]==="h"?P.hip:P.head,[r[1],r[2]]):r;
  const ls=p.ls??1,as=p.as??1;
  for(const s of["N","F"]){
    const a=ref(p["ank"+s]);
    if(p["knee"+s]){P["knee"+s]=p["knee"+s];P["ank"+s]=a;}
    else{const [k,e]=ik(P["hip"+s],a,L.th*ls,L.sh*ls,p["k"+s]??[1,0]);P["knee"+s]=k;P["ank"+s]=e;}
    P["toe"+s]=add(P["ank"+s],ldir(p["f"+s]??75),L.ft*(p.fl??1));
    const h=ref(p["hand"+s]);
    if(p["elbow"+s]){P["elbow"+s]=p["elbow"+s];P["hand"+s]=h;}
    else{const [e,hh]=ik(P["sh"+s],h,L.ua*as,L.fa*as,p["e"+s]??[0.3,1]);P["elbow"+s]=e;P["hand"+s]=hh;}
  }
  return {pts:P,hide:p.hide||[]};
}
function lerp(a,b,k){
  if(typeof a==="number"&&typeof b==="number")return a+(b-a)*k;
  if(Array.isArray(a)&&Array.isArray(b))return a.map((v,i)=>lerp(v,b[i],k));
  if(a&&b&&typeof a==="object"){const o={};for(const key of new Set([...Object.keys(a),...Object.keys(b)]))o[key]=key in a&&key in b?lerp(a[key],b[key],k):(key in b?b[key]:a[key]);return o;}
  return k<0.5?a:b;
}
const f=n=>n.toFixed(1);
const ln=(a,b,c,wd)=>`<line x1="${f(a[0])}" y1="${f(a[1])}" x2="${f(b[0])}" y2="${f(b[1])}" stroke="${c}" stroke-width="${wd}" stroke-linecap="round"/>`;
function pt(P,spec){
  if(Array.isArray(spec))return spec;
  if(spec.startsWith("mid:")){const [a,b]=spec.slice(4).split(",");return [(P[a][0]+P[b][0])/2,(P[a][1]+P[b][1])/2];}
  return P[spec];
}
function drawProp(o,P){
  const S="var(--prop)",F="var(--propfill)",A="var(--wt)";
  switch(o.type){
    case"rect":return `<rect x="${o.x}" y="${o.y}" width="${o.w}" height="${o.h}" rx="${o.rx??2}" fill="${F}" stroke="${S}" stroke-width="1.5"/>`;
    case"line":return ln(o.a,o.b,o.c==="w"?A:S,o.wd??3);
    case"wall":return `<rect x="${o.x}" y="${o.y??0}" width="${o.w??6}" height="${188-(o.y??0)}" fill="${F}" stroke="${S}" stroke-width="1.5"/>`;
    case"circle":return `<circle cx="${o.x}" cy="${o.y}" r="${o.r}" fill="${o.fill==="w"?A:F}" stroke="${S}" stroke-width="1.5"/>`;
    case"db":{const c=pt(P,o.at);return ln(add(c,[-7,0]),add(c,[7,0]),A,3)+`<rect x="${f(c[0]-10)}" y="${f(c[1]-5)}" width="5" height="10" rx="1.5" fill="${A}"/><rect x="${f(c[0]+5)}" y="${f(c[1]-5)}" width="5" height="10" rx="1.5" fill="${A}"/>`;}
    case"kb":{const c=pt(P,o.at);return `<circle cx="${f(c[0])}" cy="${f(c[1]+9)}" r="8" fill="${A}"/><path d="M${f(c[0]-5)} ${f(c[1]+4)} V${f(c[1]-1)} H${f(c[0]+5)} V${f(c[1]+4)}" fill="none" stroke="${A}" stroke-width="2.5"/>`;}
    case"plate":{const c=add(pt(P,o.at),o.off||[0,0]);return `<circle cx="${f(c[0])}" cy="${f(c[1])}" r="${o.r}" fill="none" stroke="${A}" stroke-width="4"/><circle cx="${f(c[0])}" cy="${f(c[1])}" r="2.5" fill="${A}"/>`;}
    case"band":return ln(pt(P,o.from),pt(P,o.to),A,1.6);
    case"onseg":{const a=P[o.a],b=P[o.b],c=[a[0]+(b[0]-a[0])*o.k,a[1]+(b[1]-a[1])*o.k-6];return `<rect x="${f(c[0]-9)}" y="${f(c[1]-5)}" width="18" height="10" rx="3" fill="${A}"/>`;}
    case"pad":{const c=add(pt(P,o.at),o.off||[0,0]);return `<circle cx="${f(c[0])}" cy="${f(c[1])}" r="${o.r||6}" fill="var(--propfill)" stroke="var(--prop)" stroke-width="1.5"/>`;}
    case"plat":{const c=add(pt(P,o.at),[4,-4]);return ln(add(c,[-13,-13]),add(c,[13,13]),"var(--prop)",5);}
    case"cuff":{const c=pt(P,o.at);return `<rect x="${f(c[0]-5)}" y="${f(c[1]-4)}" width="10" height="8" rx="2" fill="${A}"/>`;}
  }
  return "";
}
function render(spec,pose){
  const s=solve(pose),P=s.pts,hide=new Set(s.hide||[]);
  const near="var(--fig)",far="var(--figfar)",W=5;
  let o=`<line x1="0" y1="188" x2="260" y2="188" stroke="var(--floor)" stroke-width="2"/>`;
  const sc=spec.scene||[];
  sc.filter(x=>!x.layer).forEach(x=>o+=drawProp(x,P));
  if(s.raw){
    (s.raw.segs||[]).forEach(([a,b,c])=>o+=ln(P[a],P[b],c==="far"?far:near,s.raw.wd||W));
    if(s.raw.poly)s.raw.poly.forEach(pl=>o+=`<polyline points="${pl.p.map(n=>P[n].map(f).join(",")).join(" ")}" fill="none" stroke="${near}" stroke-width="${pl.wd||W}" stroke-linejoin="round" stroke-linecap="round"/>`);
    if(s.raw.head)o+=`<circle cx="${f(P[s.raw.head][0])}" cy="${f(P[s.raw.head][1])}" r="${L.head}" fill="var(--bg2)" stroke="${near}" stroke-width="3.5"/>`;
  }else{
    const limb=(sd,c)=>{
      if(!hide.has("leg"+sd))o+=ln(P["hip"+sd],P["knee"+sd],c,W)+ln(P["knee"+sd],P["ank"+sd],c,W)+ln(P["ank"+sd],P["toe"+sd],c,W-1);
      if(!hide.has("arm"+sd))o+=ln(P["sh"+sd],P["elbow"+sd],c,W-0.5)+ln(P["elbow"+sd],P["hand"+sd],c,W-0.5);
    };
    limb("F",far);
    sc.filter(x=>x.layer==="mid").forEach(x=>o+=drawProp(x,P));
    if(!hide.has("torso")){
      if(Math.hypot(P.hipN[0]-P.hipF[0],P.hipN[1]-P.hipF[1])>1)o+=ln(P.hipN,P.hipF,near,W);
      if(Math.hypot(P.shN[0]-P.shF[0],P.shN[1]-P.shF[1])>1)o+=ln(P.shN,P.shF,near,W);
      o+=ln(P.hip,P.mid,near,W+1)+ln(P.mid,P.sh,near,W+1);
    }
    if(!hide.has("head"))o+=ln(P.sh,P.head,near,3.5)+`<circle cx="${f(P.head[0])}" cy="${f(P.head[1])}" r="${L.head}" fill="var(--bg2)" stroke="${near}" stroke-width="3.5"/>`;
    limb("N",near);
  }
  sc.filter(x=>x.layer==="top").forEach(x=>o+=drawProp(x,P));
  const vb=(spec.vb||"0 0 260 196").split(" ").map(Number);
  if(pose.label)o+=`<text x="${vb[0]+8}" y="${vb[1]+16}" font-size="12" font-weight="600" fill="var(--figfar)" font-family="Barlow,system-ui,sans-serif">${pose.label}</text>`;
  return o;
}
function poseAt(spec,ms){
  const fr=spec.frames,n=fr.length;let total=0;const segs=[];
  for(let i=0;i<n;i++){const nx=fr[(i+1)%n];segs.push({a:fr[i],b:nx,hold:fr[i].hold||0,d:nx.cut?0:(nx.d??1000)});total+=(fr[i].hold||0)+(nx.cut?0:(nx.d??1000));}
  let t=(ms*(spec.speed||1))%total;
  for(const s of segs){
    if(t<s.hold)return s.a.p;t-=s.hold;
    if(t<s.d){const k=(1-Math.cos(Math.PI*t/s.d))/2;return lerp(s.a.p,s.b.p,k);}t-=s.d;
  }
  return fr[0].p;
}

/* ---------- Exercise library ---------- */
const STAND={hip:[130,100],t:0,ankN:[133,184],ankF:[128,184]};
const run=(sp)=>({speed:sp,frames:[
  {d:500,p:{hip:[130,104],t:12,ankN:["h",26,76],ankF:["h",-30,62],kN:[1,0],kF:[1,0.3],handN:["s",-14,32],eN:[-1,0.2],handF:["s",20,20],eF:[0.2,1]}},
  {d:500,p:{hip:[130,100],t:12,ankF:["h",26,76],ankN:["h",-30,62],kN:[1,0.3],kF:[1,0],handF:["s",-14,32],eF:[-1,0.2],handN:["s",20,20],eN:[0.2,1]}}]});
const SPd={hip:[150,180],t:-58,w:5,sw:8,ankN:[236,173],ankF:[236,182],elbowF:[102,187],handF:[113,188],handN:["h",0,-6],eN:[0,-1],fN:100,fF:100,fl:.5};
const SPu={...SPd,hip:[154,162],t:-78};
const sidePlank=(lab)=>[
  {d:300,cut:true,hold:400,p:{label:lab,...SPd}},
  {d:900,hold:2500,p:{label:lab,...SPu}}];
const A={
goblet:{scene:[{type:"kb",at:"mid:handN,handF"}],frames:[
  {d:1100,hold:300,p:{...STAND,hip:[128,100],t:4,handN:["s",14,10],handF:["s",12,10],eN:[0.2,1],eF:[0.2,1]}},
  {d:1100,hold:300,p:{...STAND,hip:[106,141],t:34,handN:["s",14,10],handF:["s",12,10],eN:[0.2,1],eF:[0.2,1]}}]},
rdl:{scene:[{type:"db",at:"handN"}],frames:[
  {d:1300,hold:300,p:{...STAND,ankN:[131,184],ankF:[129,184],t:3,handN:["s",2,55],handF:["s",0,55]}},
  {d:1300,hold:300,p:{...STAND,ankN:[131,184],ankF:[129,184],hip:[110,104],t:78,handN:["s",-3,54],handF:["s",-5,54]}}]},
bss:{scene:[{type:"rect",x:30,y:150,w:56,h:38},{type:"db",at:"handN"}],frames:[
  {d:1100,hold:300,p:{hip:[120,100],t:8,ankN:[154,184],ankF:[72,146],kF:[0.3,1],fF:-73,handN:["s",2,54],handF:["s",0,54]}},

const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));


/* ---------- Weight log ---------- */
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const drafts = {};
let EX = store.get("recomp-exlog",{});
const RENAMED = [["bench-or-dumbbell-press","dumbbell-press","Dumbbell press"],["pull-ups-or-lat-pulldown","lat-pulldown","Lat pulldown"]];
function migrateNames(){ RENAMED.forEach(([o,n,nm]) => { if(EX[o] && !EX[n]) EX[n] = { name: nm, hist: EX[o].hist }; }); }
migrateNames();
let dbh = null, synced = false;
const fmtDate = iso => { try{ return new Date(iso).toLocaleDateString(undefined,{month:"short",day:"numeric"}); }catch(e){ return ""; } };
const LOGTYPE = {"Rathleff heel raise":"r","Plank":"s","Side plank":"s","Sit-ups":"r","Dead bug":"r","Chin tucks":"r","Banded hip flexion":"b"};
const BANDS = [["Green","#2e9e6b"],["Yellow","#e2b423"],["Blue","#2f56b0"],["Red","#c8323e"],["Purple","#7a5bbd"]];
const bandColor = n => (BANDS.find(b=>b[0]===n)||[0,"transparent"])[1];
function updDot(sel){ const d = sel.previousElementSibling; if(d) d.style.background = bandColor(sel.value); };
function nSets(dose){ const m = dose.match(/^(\d+)(?:\s*[–-]\s*(\d+))?\s*×/); return m ? Math.min(+(m[2]||m[1]),6) : 3; }
function histOf(sl){ return (EX[sl] && EX[sl].hist) || []; }
function setsOf(e){ return e ? (Array.isArray(e.sets) ? e.sets : [{w:e.w??"", r:e.r??""}]) : []; }
function lastOf(sl){ return histOf(sl)[0] || null; }
function fmtSet(s,t){
  if(t==="s") return s.r ? s.r+"s" : "";
  if(t==="r") return s.r ? String(s.r) : "";
  if(t==="b") return [s.w||"", s.r?String(s.r):""].filter(Boolean).join(" ×");
  return [s.w!==""&&s.w!=null ? String(s.w) : "", s.r ? String(s.r) : ""].filter(Boolean).join("×");
}
function lastText(sl,t){
  const e = lastOf(sl); if(!e) return "No log yet";
  const ss = setsOf(e).map(s=>fmtSet(s,t||"wr")).filter(Boolean);
  return `Last time (${fmtDate(e.at)}): <b>${esc(ss.join(", "))}</b>`;
}
function logRow(name,dose){
  const sl = slug(name), t = LOGTYPE[name] || "wr", n = nSets(dose), last = setsOf(lastOf(sl));
  let rows = "";
  for(let i=0;i<n;i++){
    const p = last[i] || {};
    rows += `<div class="setrow"><span class="setn">Set ${i+1}</span>` +
      (t==="b" ? `<span class="bdot" style="background:${bandColor(p.w)}"></span><select id="w-${sl}-${i}" class="bandsel" aria-label="${esc(name)} set ${i+1} band"><option value="">Band</option>${BANDS.map(b=>`<option${b[0]===p.w?" selected":""}>${b[0]}</option>`).join("")}</select><span class="x">×</span>` : "") +
      (t==="wr" ? `<input id="w-${sl}-${i}" inputmode="decimal" maxlength="7" placeholder="${p.w?esc(String(p.w)):""}" aria-label="${esc(name)} set ${i+1} weight in pounds"><span class="x">lb ×</span>` : "") +
      `<input id="r-${sl}-${i}" inputmode="numeric" maxlength="5" placeholder="${p.r?esc(String(p.r)):""}" aria-label="${esc(name)} set ${i+1} ${t==="s"?"seconds":"reps"}">` +
      `<span class="x">${t==="s"?"sec":"reps"}</span></div>`;
  }
  return `<div class="log" data-s="${sl}" data-t="${t}">${rows}<div class="logfoot"><button class="logbtn" data-s="${sl}" data-n="${esc(name)}">Save sets</button><p class="last">${lastText(sl,t)}</p></div></div>`;
}
function syncNote(){ return synced ? "Logs sync to your account." : "Logs save on this phone."; }
function refreshLast(){
  document.querySelectorAll(".log").forEach(box => {
    const sl = box.dataset.s, t = box.dataset.t, last = setsOf(lastOf(sl));
    box.querySelectorAll("select").forEach(sel => {
      const i = +sel.id.split("-").pop(); if(!sel.value) sel.value = (last[i] && last[i].w) || ""; updDot(sel);
    });
    box.querySelectorAll("input").forEach(inp => {
      const parts = inp.id.split("-"), k = parts[0], i = +parts[parts.length-1], p = last[i] || {};
      inp.placeholder = k==="w" ? (p.w ? String(p.w) : "") : (p.r ? String(p.r) : "");
    });
    const l = box.querySelector(".last"); if(l) l.innerHTML = lastText(sl,t);
  });
  const s = document.getElementById("syncnote"); if(s) s.textContent = syncNote();
}
async function saveLog(b){
  const sl = b.dataset.s, name = b.dataset.n, box = b.closest(".log"), t = box.dataset.t;
  const last = setsOf(lastOf(sl)), sets = []; let carry = "";
  box.querySelectorAll(".setrow").forEach((row,i) => {
    const wi = row.querySelector('[id^="w-"]'), ri = row.querySelector('input[id^="r-"]');
    const r = ri.value.trim().slice(0,5);
    let w = wi ? wi.value.trim().slice(0,7) : "";
    if(wi && w) carry = w;
    if(!r) return;
    if(wi && !w) w = carry || ((last[i] && last[i].w) ? String(last[i].w) : "");
    sets.push({ w, r });
  });
  if(!sets.length){ b.textContent = t==="s" ? "Enter seconds" : "Enter reps"; setTimeout(()=>b.textContent="Save sets",1500); return; }
  const entry = { at: new Date().toISOString(), sets };
  const hist = [entry, ...histOf(sl)].slice(0,200);
  EX[sl] = { name, hist };
  store.set("recomp-exlog", EX);
  box.querySelectorAll("input, select").forEach(i => { i.value = ""; delete drafts[i.id]; });
  refreshLast();
  b.textContent = "Saved " + sets.length + (sets.length===1 ? " set" : " sets");
  if(dbh){ try{ await dbh.collection("exlog").doc(sl).set({ name, hist }); }catch(e){ b.textContent = "Saved on this phone only"; } }
  setTimeout(()=>b.textContent="Save sets",1800);
}

(async () => {
  try{
    if(!window.claude || !window.claude.use) return;
    dbh = await window.claude.use("db"); if(!dbh) return;
    dbh.collection("exlog").onSnapshot(snap => {
      synced = true;
      snap.docs.forEach(d => { const v = d.data(); if(v && Array.isArray(v.hist)) EX[d.id] = v; }); migrateNames();
      store.set("recomp-exlog", EX); refreshLast();
    }, () => { synced = false; refreshLast(); });
  }catch(e){ dbh = null; }
})();

async function backupLog(){
  const n = Object.values(EX).reduce((a,v)=>a+((v&&v.hist)||[]).length,0);
  if(!n){ bkMsg("Nothing logged yet."); return; }
  const data = JSON.stringify({app:"recomp-workouts",version:1,exported:new Date().toISOString(),log:EX},null,1);
  const filename = "recomp-log-" + new Date().toISOString().slice(0,10) + ".json";
  let dl = null;
  try{ if(window.claude && window.claude.use) dl = await window.claude.use("downloads"); }catch(e){ dl = null; }
  if(dl){
    try{ const r = await dl.save({filename, data}); bkMsg(r && r.status==="delivered" ? "Backup sent." : "Backup saved ("+n+" workouts logged). Move it to Google Drive or iCloud to keep it safe."); }
    catch(e){ bkMsg(e && e.code==="unavailable" ? "Saving files isn't available here. Try the page in a browser." : "Backup not saved."); }
    return;
  }
  try{
    const url = URL.createObjectURL(new Blob([data],{type:"application/json"}));
    const a = document.createElement("a"); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
    bkMsg("Backup saved ("+n+" workouts logged). Move it to Google Drive or iCloud to keep it safe.");
  }catch(e){ bkMsg("Backup not saved."); }
}
async function restoreLog(file){
  let obj;
  try{ obj = JSON.parse(await file.text()); }catch(e){ bkMsg("That file isn't a log backup."); return; }
  const log = obj && obj.app==="recomp-workouts" && obj.log;
  if(!log || typeof log!=="object"){ bkMsg("That file isn't a log backup."); return; }
  let added = 0; const changed = [];
  for(const sl of Object.keys(log)){
    const inc = log[sl]; if(!inc || !Array.isArray(inc.hist)) continue;
    const cur = (EX[sl] && EX[sl].hist) || [];
    const seen = new Set(cur.map(e=>e.at));
    const fresh = inc.hist.filter(e => e && typeof e.at==="string" && !seen.has(e.at)).map(e => ({at:e.at, sets:(Array.isArray(e.sets)?e.sets:[{w:e.w,r:e.r}]).slice(0,8).map(s=>({w:String((s&&s.w)??"").slice(0,7), r:String((s&&s.r)??"").slice(0,5)}))}));
    if(!fresh.length) continue;
    added += fresh.length;
    const hist = [...cur, ...fresh].sort((a,b)=> a.at<b.at?1:-1).slice(0,300);
    EX[sl] = { name: (EX[sl]&&EX[sl].name) || String(inc.name||sl).slice(0,80), hist };
    changed.push(sl);
  }
  store.set("recomp-exlog", EX); refreshLast();
  if(dbh){ for(const sl of changed){ try{ await dbh.collection("exlog").doc(sl).set(EX[sl]); }catch(e){} } }
  bkMsg(added ? "Restored "+added+" logged workouts." : "Nothing new in that backup.");
}

function renderTabs(){
  const t = document.getElementById("tabs");
  t.innerHTML = DAYS.map(d => `<button role="tab" id="tab-${d.key}" aria-selected="${d.key===current}" data-k="${d.key}">${d.tab}</button>`).join("");
  t.querySelectorAll("button").forEach(b => b.addEventListener("click", () => { current=b.dataset.k; bigId=null; store.set("recomp-tab",current); renderPage(); window.scrollTo({top:0}); }));
}

function renderPage(){
  document.querySelectorAll(".log input, .log select").forEach(i=>{ if(i.value) drafts[i.id]=i.value; else delete drafts[i.id]; });
  renderTabs();
  const d = DAYS.find(x=>x.key===current);
  const ids = [];
  let html = "";
  d.groups.forEach((g,gi) => {
    html += `<div class="group">${esc(g.label)}</div>${g.note?`<p class="gnote">${esc(g.note)}</p>`:""}<ul class="list">`;
    g.items.forEach(([name,dose,note,vid,ak],ii) => {
      const id = `${d.key}-${gi}-${ii}`; ids.push(id);
      const isDone = !!done[id];
      html += `<li class="ex${isDone?" is-done":""}${bigId===id?" big":""}" data-id="${id}">
        <button class="check" aria-pressed="${isDone}" aria-label="Mark ${esc(name)} done">${tickIcon}</button>
        <div class="info"><p class="name">${esc(name)}</p><span class="dose">${esc(dose)}</span>${note?`<p class="note">${esc(note)}</p>`:""}<a class="vid" href="${YT(vid)}" target="_blank" rel="noopener">Full video</a></div>
        ${GIF[ak]?`<button class="anim has-gif" data-g="${ak}" aria-label="${bigId===id?"Shrink":"Enlarge"} ${esc(name)} demo"><img src="${GIF[ak]}" loading="lazy" alt="${esc(name)} demo"></button>`:`<button class="anim" data-a="${ak}" aria-label="${bigId===id?"Shrink":"Enlarge"} ${esc(name)} demo"><svg viewBox="${A[ak].vb||"0 0 260 196"}" role="img" aria-label="${esc(name)} demo animation"></svg></button>`}
        ${g.nolog?"":logRow(name,dose)}
      </li>`;
    });
    html += `</ul>`;
  });
  const n = ids.filter(i=>done[i]).length;
  document.getElementById("day").innerHTML = `
    <div class="dayhead"><h2>${esc(d.title)}</h2><span class="progress">${n} / ${ids.length} done</span></div>
    ${d.sub?`<p class="sub">${esc(d.sub)}</p>`:""}
    ${html}
    <div class="foot"><p class="tip">Tap a demo to enlarge it. Tap the circle to check off an exercise. Grey numbers are last time. Type the weight once and it carries to the next sets. <span id="syncnote">${syncNote()}</span></p><button class="reset" id="reset">Clear checks</button></div>
    <div class="backup"><p class="tip">Back up your weight log to a file, then save it to Google Drive from your phone's share or save screen.</p><div class="bkbtns"><button class="reset" id="bk">Back up log</button><label class="reset" for="restore">Restore</label><input type="file" id="restore" accept=".json,application/json" hidden></div><p class="bkmsg" id="bkmsg" role="status"></p></div>`;
  document.querySelectorAll(".check").forEach(b => b.addEventListener("click", () => {
    const id = b.closest(".ex").dataset.id; done[id] = !done[id]; if(!done[id]) delete done[id];
    store.set("recomp-done",done); renderPage();
  }));
  document.querySelectorAll("button.anim").forEach(b => b.addEventListener("click", () => {
    const id = b.closest(".ex").dataset.id; bigId = bigId===id ? null : id; renderPage();
  }));
  document.querySelectorAll(".log input, .log select").forEach(i=>{ if(drafts[i.id]) i.value=drafts[i.id]; });
  document.querySelectorAll(".bandsel").forEach(s => s.addEventListener("change", () => updDot(s)));
  document.querySelectorAll(".logbtn").forEach(b => b.addEventListener("click", () => saveLog(b)));
  tick(performance.now(), true);
  document.getElementById("bk").addEventListener("click", backupLog);
  document.getElementById("restore").addEventListener("change", e => { const f = e.target.files && e.target.files[0]; if(f) restoreLog(f); e.target.value = ""; });
  document.getElementById("reset").addEventListener("click", () => { ids.forEach(i=>delete done[i]); store.set("recomp-done",done); renderPage(); });
}
renderPage();

var lastT=0;
function tick(now, force){
  if(force || now-lastT>33){ lastT=now;
    document.querySelectorAll("button.anim svg").forEach(svg=>{
      const k=svg.parentNode.dataset.a; svg.innerHTML=render(A[k],poseAt(A[k],now));
    });
  }
  if(!force) requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
